coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 90%
        threshold: 1%
comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true
flags:
  go:
    paths:
      - "**/*.go"
ignore:
  - "tools/**"
  # Zenodo and cross-provider flows have separate provider-specific harnesses;
  # keep them out of the OSF release patch gate while retaining their tests.
  - "internal/zenodo*/**"
  - "internal/crossprovider/**"
  - "internal/cli/zenodo_*.go"
  - "internal/mcpserver/zenodo_*.go"
