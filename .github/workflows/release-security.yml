name: Release Security Metadata

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to sign when manually rerunning security metadata
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/edithatogo/osf-cli-go-osf-mcp
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
      - name: Build and publish image with SBOM and provenance
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.mcp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign published image keylessly
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEFAULT_IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          image_tag="${IMAGE_TAG:-$DEFAULT_IMAGE_TAG}"
          cosign sign --yes "ghcr.io/edithatogo/osf-cli-go-osf-mcp:${image_tag}"
