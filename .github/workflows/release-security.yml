name: Release Security Metadata

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  container:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Gate provenance and SBOM on provider claims
        run: go run ./tools/checkproviderrelease
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/edithatogo/osf-cli-go-osf-mcp
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
      - name: Build an unpromoted candidate with SBOM and provenance
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.mcp
          push: true
          tags: ghcr.io/edithatogo/osf-cli-go-osf-mcp:rc-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

  scan:
    name: Grype container (${{ matrix.arch }})
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the immutable platform manifest
        id: platform
        env:
          IMAGE: ghcr.io/edithatogo/osf-cli-go-osf-mcp
          INDEX_DIGEST: ${{ needs.container.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/container-manifest"
          docker buildx imagetools inspect "$IMAGE@$INDEX_DIGEST" --raw > "$RUNNER_TEMP/container-manifest/index.json"
          digest="$(jq -er --arg arch "$ARCH" '
            [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)]
            | if length == 1 then .[0].digest else error("Expected exactly one runtime platform manifest") end
            | select(test("^sha256:[0-9a-f]{64}$"))
          ' "$RUNNER_TEMP/container-manifest/index.json")"
          jq -n --arg image "$IMAGE" --arg index "$INDEX_DIGEST" --arg digest "$digest" --arg platform "linux/$ARCH"  \
            '{image: $image, index: $index, digest: $digest, platform: $platform}' > "$RUNNER_TEMP/container-manifest/identity.json"
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
      - name: Enforce the critical vulnerability gate
        uses: edithatogo/repository-standards/.github/actions/grype-scan@bf6bb998414f275296dd174d459504a0c45582b5
        with:
          image: ${{ steps.platform.outputs.image }}
          platform: linux/${{ matrix.arch }}
          mode: enforce
          severity-cutoff: critical
          artifact-name: grype-container-${{ matrix.arch }}
          output-directory: ${{ runner.temp }}/grype-container-${{ matrix.arch }}
          source-sha: ${{ github.sha }}
      - name: Retain index and platform binding
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-manifest-${{ matrix.arch }}
          path: ${{ runner.temp }}/container-manifest
          if-no-files-found: error
          retention-days: 90

  promote:
    needs: [container, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the scanned candidate keylessly
        env:
          IMAGE: ghcr.io/edithatogo/osf-cli-go-osf-mcp
          IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          cosign sign --yes "$IMAGE@$IMAGE_DIGEST"
      - name: Promote the scanned image without rebuilding
        env:
          IMAGE: ghcr.io/edithatogo/osf-cli-go-osf-mcp
          IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
          IMAGE_TAGS: ${{ needs.container.outputs.tags }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          [ "${#args[@]}" -gt 0 ]
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$IMAGE@$IMAGE_DIGEST"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            actual="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
            [ "$actual" = "$IMAGE_DIGEST" ]
            echo "Promoted $tag@$actual" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$IMAGE_TAGS"
