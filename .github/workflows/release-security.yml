name: Release Security Metadata

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to sign when manually rerunning security metadata
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/edithatogo/osf-cli-go-osf-mcp
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
      - name: Build and publish image with SBOM and provenance
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.mcp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign published image keylessly
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEFAULT_IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          image_tag="${IMAGE_TAG:-$DEFAULT_IMAGE_TAG}"
          cosign sign --yes "ghcr.io/edithatogo/osf-cli-go-osf-mcp:${image_tag}"
