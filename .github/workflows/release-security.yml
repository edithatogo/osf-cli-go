name: Release Security Metadata

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image with SBOM and provenance
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.mcp
          push: true
          tags: ghcr.io/edithatogo/osf-cli-go-osf-mcp:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.0
      - name: Sign published image keylessly
        env:
          IMAGE: ghcr.io/edithatogo/osf-cli-go-osf-mcp:${{ github.ref_name }}
        run: cosign sign --yes "$IMAGE"
