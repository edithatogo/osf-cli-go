name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-go-install:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "stable"
      - name: Verify tagged go install version
        env:
          MODULE: github.com/edithatogo/osf-cli-go/cmd/osf
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          go install "$MODULE@$GITHUB_REF_NAME"
          installed="$("$(go env GOPATH)/bin/osf" --version)"
          test "$installed" = "$version"

  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build release binaries
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/osf-$GOOS-$GOARCH$suffix" ./cmd/osf
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/osf-mcp-$GOOS-$GOARCH$suffix" ./cmd/osf-mcp
          GOOS= GOARCH= go run ./tools/checksums dist "dist/SHA256SUMS-$GOOS-$GOARCH.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: osf-cli-go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: osf-cli-go-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
