name: MCPB Bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Install MCPB CLI
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts https://registry.npmjs.org/@anthropic-ai/mcpb/-/mcpb-2.1.2.tgz
          node -e 'const fs=require("fs"); const crypto=require("crypto"); const expected="goRbBC8ySo7SWb7tRzr+tL6FxDc4JPTRCdgfD2omba7freofvjq5rom1lBnYHZHo6Mizs1jAHJeN53aZbDoy8A=="; const actual=crypto.createHash("sha512").update(fs.readFileSync("anthropic-ai-mcpb-2.1.2.tgz")).digest("base64"); if (actual !== expected) { throw new Error(`MCPB integrity mismatch: ${actual}`); }'
          npm install --global --ignore-scripts ./anthropic-ai-mcpb-2.1.2.tgz

      - name: Build MCPB bundle
        shell: pwsh
        run: ./scripts/build-mcpb.ps1 -Version "$($env:GITHUB_REF_NAME.Substring(1))" -UseMcpbCli

      - name: Upload MCPB bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcpb-${{ runner.os }}
          path: dist/mcpb/*.mcpb
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: mcpb-*
          path: dist
          merge-multiple: true
      - name: Upload MCPB release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = 24 ]; then
              echo "release $GITHUB_REF_NAME was not created" >&2
              exit 1
            fi
            sleep 5
          done
          mapfile -t assets < <(find dist -type f -name '*.mcpb' -print)
          test "${#assets[@]}" -gt 0
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
