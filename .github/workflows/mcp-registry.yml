name: MCP Registry

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.3.0"

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.mcp
          push: true
          tags: ghcr.io/edithatogo/osf-cli-go-osf-mcp:0.3.0
          build-args: |
            VERSION=0.3.0
            REVISION=${{ github.sha }}
          labels: |
            io.modelcontextprotocol.server.name=io.github.edithatogo/osf-cli-go
            org.opencontainers.image.version=0.3.0
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/mcp-publisher

      - name: Validate server.json
        run: mcp-publisher validate server.json

      - name: Publish to MCP Registry
        run: |
          mcp-publisher login github-oidc
          set +e
          mcp-publisher publish server.json 2>&1 | tee publish.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -q "cannot publish duplicate version" publish.log; then
              echo "MCP Registry version already exists; treating duplicate publish as success."
            else
              exit "$status"
            fi
          fi
