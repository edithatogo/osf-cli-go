name: ci

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code
      - name: Test
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Anti-stub scan
        run: go run ./tools/checkstubs
      - name: Conductor review evidence
        run: go run ./tools/checkreviews
      - name: Registry submission contract
        run: go run ./tools/checkregistries
      - name: Feature matrix contract
        run: go run ./tools/checkfeaturematrix
      - name: Release readiness contract
        run: go run ./tools/checkreleasecontract
      - name: Coverage
        run: |
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out
      - name: Coverage summary
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage.out
          path: coverage.out
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          flags: go
          fail_ci_if_error: true
          use_oidc: true
          slug: edithatogo/osf-cli-go
