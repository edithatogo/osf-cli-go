name: ci

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code
      - name: Test
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Fuzz URL resolution
        run: go test ./internal/osfapi -run=FuzzResolveReference -fuzz=FuzzResolveReference -fuzztime=10s
      - name: Vet
        run: go vet ./...
      - name: Anti-stub scan
        run: go run ./tools/checkstubs
      - name: Conductor review evidence
        run: go run ./tools/checkreviews
      - name: Registry submission contract
        run: go run ./tools/checkregistries
      - name: Feature matrix contract
        run: go run ./tools/checkfeaturematrix
      - name: Zenodo API capability contract
        run: go run ./tools/checkzenodoapi
      - name: Repository provider conformance
        run: go test ./internal/repository/...
      - name: Release readiness contract
        run: go run ./tools/checkreleasecontract
      - name: Compatibility contract
        run: go test ./internal/cli ./internal/mcpserver -run 'CompatibilityFixture|RootContractMatchesCompatibilityFixture'
      - name: Coverage
        run: |
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out
      - name: Coverage summary
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage.out
          path: coverage.out
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage.out
          flags: go
          fail_ci_if_error: true
          use_oidc: true
          slug: edithatogo/osf-cli-go

  codecov:
    name: codecov/patch
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Generate coverage profile
        run: go test ./... -coverprofile=coverage.out
      - name: Upload patch coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage.out
          flags: go
          fail_ci_if_error: true
          use_oidc: true
          slug: edithatogo/osf-cli-go
