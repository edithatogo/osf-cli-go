version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
    - asciicheck
    - copyloopvar
    - decorder
    - errorlint
    - forbidigo
    - gocritic
    - gofmt
    - gosec
    - nilerr
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - tenv
    - thelper
    - tparallel
    - usetesting

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
