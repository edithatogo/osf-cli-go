version: 2

project_name: osf

before:
  hooks:
    - go test ./...

builds:
  - id: osf
    main: ./cmd/osf
    binary: osf
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/edithatogo/osf-cli-go/internal/cli.version={{.Version}}
      - -X github.com/edithatogo/osf-cli-go/internal/cli.buildCommit={{.Commit}}
      - -X github.com/edithatogo/osf-cli-go/internal/cli.buildDate={{.Date}}
  - id: osf-mcp
    main: ./cmd/osf-mcp
    binary: osf-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: osf
    ids:
      - osf
      - osf-mcp
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - CONTRIBUTING.md
      - docs/release-checklist.md

checksum:
  name_template: checksums.txt

release:
  disable: false

snapshot:
  version_template: "{{ incpatch .Version }}-next"
